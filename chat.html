<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>實康復健科診所 - 線上客服</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal-dark: #1a5f6e;
    --teal: #2e7d8c;
    --teal-light: #3d9aad;
    --teal-pale: #e8f4f7;
    --white: #ffffff;
    --gray-50: #f8fafb;
    --gray-100: #edf1f3;
    --gray-300: #c8d4d8;
    --gray-500: #7a9099;
    --gray-700: #3d5560;
    --gray-900: #1a2e35;
  }

  /* 關鍵：讓整個頁面固定，不跟著鍵盤移動 */
  html {
    height: -webkit-fill-available;
  }

  body {
    min-height: 100vh;
    min-height: -webkit-fill-available;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    -webkit-text-size-adjust: 100%;
    display: flex;
    flex-direction: column;
  }

  #app {
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    background: var(--white);
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
    /* 關鍵：讓 messages 區可以滾動，其他固定 */
    overflow: hidden;
    height: 100vh;
    height: -webkit-fill-available;
  }

  #chat-header {
    background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 60%, var(--teal-light) 100%);
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    min-height: 60px;
    position: relative;
    overflow: hidden;
  }

  #header-avatar {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.25);
  }
  #header-avatar svg { width: 22px; height: 22px; fill: white; }
  #header-info { flex: 1; }
  #header-name { color: white; font-size: 15px; font-weight: 600; }
  #header-sub { color: rgba(255,255,255,0.72); font-size: 11px; margin-top: 2px; display: flex; align-items: center; gap: 4px; }
  .status-dot { width: 6px; height: 6px; background: #7ee8a2; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  #back-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px; color: white;
    padding: 6px 12px; font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center; gap: 4px; flex-shrink: 0;
  }
  #back-btn svg { width: 14px; height: 14px; fill: white; }

  #quick-replies {
    display: flex; gap: 8px; padding: 8px 16px;
    overflow-x: auto; flex-shrink: 0;
    background: var(--white);
    border-bottom: 1px solid var(--gray-100);
    scrollbar-width: none;
  }
  #quick-replies::-webkit-scrollbar { display: none; }

  .quick-btn {
    flex-shrink: 0; font-size: 12px; padding: 5px 13px;
    border-radius: 20px; border: 1.5px solid var(--teal);
    color: var(--teal); background: var(--white);
    cursor: pointer; font-family: 'Noto Sans TC', sans-serif;
    white-space: nowrap; -webkit-tap-highlight-color: transparent;
  }
  .quick-btn:active { background: var(--teal); color: white; }

  /* 訊息區：flex:1 讓它佔滿剩餘空間，overflow-y:auto 讓它可以滾動 */
  #messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--gray-50);
    min-height: 0; /* 關鍵：flex 子項目需要這個才能正確收縮 */
  }

  .date-divider { text-align: center; font-size: 11px; color: var(--gray-500); margin: 4px 0; }

  .welcome-card {
    background: linear-gradient(135deg, var(--teal-pale), #f0f9fb);
    border: 1px solid rgba(46,125,140,0.15);
    border-radius: 16px; padding: 16px;
  }
  .welcome-card h3 { font-size: 14px; font-weight: 600; color: var(--teal-dark); margin-bottom: 6px; }
  .welcome-card p { font-size: 13px; color: var(--gray-700); line-height: 1.6; }

  .msg-row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; animation: fadeUp 0.2s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }

  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-dark), var(--teal));
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .msg-avatar svg { width: 16px; height: 16px; fill: white; }

  .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
  .msg-row.user .bubble { background: linear-gradient(135deg, var(--teal), var(--teal-dark)); color: white; border-bottom-right-radius: 4px; }
  .msg-row.bot .bubble { background: var(--white); color: var(--gray-900); border-bottom-left-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }

  .typing-row { display: flex; gap: 8px; align-items: flex-end; align-self: flex-start; }
  .typing-bubble { background: var(--white); border-radius: 18px; border-bottom-left-radius: 4px; padding: 12px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); display: flex; gap: 5px; align-items: center; }
  .t-dot { width: 7px; height: 7px; background: var(--teal); border-radius: 50%; animation: bounce 1.2s infinite; opacity: 0.5; }
  .t-dot:nth-child(2){animation-delay:0.2s} .t-dot:nth-child(3){animation-delay:0.4s}
  @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.5} 30%{transform:translateY(-6px);opacity:1} }

  /* 輸入區固定在底部 */
  #input-area {
    padding: 10px 16px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    background: var(--white);
    border-top: 1px solid var(--gray-100);
    display: flex; gap: 10px; align-items: center;
    flex-shrink: 0;
  }

  #msg-input {
    flex: 1;
    border: 1.5px solid var(--gray-300);
    border-radius: 24px;
    padding: 10px 18px;
    font-size: 16px; /* 防止 iOS 縮放 */
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--gray-900);
    outline: none;
    background: var(--gray-50);
    -webkit-appearance: none;
  }
  #msg-input:focus { border-color: var(--teal); background: var(--white); }
  #msg-input::placeholder { color: var(--gray-500); }

  #send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; -webkit-tap-highlight-color: transparent;
  }
  #send-btn:active { opacity: 0.8; }
  #send-btn:disabled { opacity: 0.4; }
  #send-btn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="chat-header">
    <div id="header-avatar">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
    </div>
    <div id="header-info">
      <div id="header-name">實康復健科診所</div>
      <div id="header-sub"><span class="status-dot"></span>AI 客服助理</div>
    </div>
    <a href="https://www.smartcare.com.tw" id="back-btn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      回官網
    </a>
  </div>

  <div id="quick-replies">
    <button class="quick-btn" onclick="quickSend('門診時間？')">門診時間</button>
    <button class="quick-btn" onclick="quickSend('如何掛號？')">如何掛號</button>
    <button class="quick-btn" onclick="quickSend('診療項目有哪些？')">診療項目</button>
    <button class="quick-btn" onclick="quickSend('兒童早期療育')">早期療育</button>
    <button class="quick-btn" onclick="quickSend('彼拉提斯課程')">彼拉提斯</button>
    <button class="quick-btn" onclick="quickSend('掛號費多少？')">掛號費</button>
  </div>

  <div id="messages">
    <div class="date-divider">今天</div>
    <div class="welcome-card">
      <h3>歡迎使用線上客服</h3>
      <p>您好！我是實康復健科診所的 AI 客服助理，可以回答門診時間、掛號方式、診療項目等問題。如需更多協助，請來電 02-26292000。</p>
    </div>
  </div>

  <div id="input-area">
    <input type="text" id="msg-input" placeholder="請輸入您的問題..."
      onkeydown="handleKey(event)" autocomplete="off" autocorrect="off" autocapitalize="off" />
    <button id="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  var API_URL = 'https://smartcare-chatbot.vercel.app/api/chat';
  var isLoading = false;

  function scrollToBottom() {
    var msgs = document.getElementById('messages');
    setTimeout(function() { msgs.scrollTop = msgs.scrollHeight; }, 50);
  }

  function addMessage(type, text) {
    var msgs = document.getElementById('messages');
    var row = document.createElement('div');
    row.className = 'msg-row ' + type;
    if (type === 'bot') {
      var av = document.createElement('div');
      av.className = 'msg-avatar';
      av.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
      row.appendChild(av);
    }
    var b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = text;
    row.appendChild(b);
    msgs.appendChild(row);
    scrollToBottom();
  }

  function showTyping() {
    var msgs = document.getElementById('messages');
    var row = document.createElement('div');
    row.className = 'typing-row'; row.id = 'typing';
    var av = document.createElement('div');
    av.className = 'msg-avatar';
    av.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
    var dots = document.createElement('div');
    dots.className = 'typing-bubble';
    dots.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
    row.appendChild(av); row.appendChild(dots);
    msgs.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    var el = document.getElementById('typing');
    if (el) el.remove();
  }

  function doSend(message) {
    if (!message || isLoading) return;
    var btn = document.getElementById('send-btn');
    isLoading = true; btn.disabled = true;
    addMessage('user', message);
    showTyping();
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message })
    })
    .then(function(r) { return r.json(); })
    .then(function(d) { removeTyping(); addMessage('bot', d.reply || '抱歉，請來電 02-26292000 詢問。'); })
    .catch(function() { removeTyping(); addMessage('bot', '抱歉，網路異常，請來電 02-26292000。'); })
    .finally(function() { isLoading = false; btn.disabled = false; });
  }

  function sendMsg() {
    var input = document.getElementById('msg-input');
    var msg = input.value.trim();
    input.value = '';
    doSend(msg);
  }

  function quickSend(text) { if (!isLoading) doSend(text); }

  function handleKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation();
      var input = e.target;
      var msg = input.value.trim();
      input.value = '';
      input.blur();
      input.focus();
      doSend(msg);
      return false;
    }
  }
</script>
</body>
</html>
