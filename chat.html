<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>實康復健科診所 - 線上客服</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --teal-dark: #1a5f6e;
    --teal: #2e7d8c;
    --teal-light: #3d9aad;
    --teal-pale: #e8f4f7;
    --white: #ffffff;
    --gray-50: #f8fafb;
    --gray-100: #edf1f3;
    --gray-300: #c8d4d8;
    --gray-500: #7a9099;
    --gray-700: #3d5560;
    --gray-900: #1a2e35;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--gray-50);
    color: var(--gray-900);
    -webkit-text-size-adjust: 100%;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 680px;
    margin: 0 auto;
    background: var(--white);
    box-shadow: 0 0 60px rgba(0,0,0,0.08);
  }

  /* Header */
  #chat-header {
    background: linear-gradient(135deg, var(--teal-dark) 0%, var(--teal) 60%, var(--teal-light) 100%);
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
    min-height: 72px;
  }

  #chat-header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  #chat-header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 40px;
    width: 80px; height: 80px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }

  #header-avatar {
    width: 46px; height: 46px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.25);
  }

  #header-avatar svg { width: 24px; height: 24px; fill: white; }

  #header-info { flex: 1; z-index: 1; }

  #header-name {
    color: white;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  #header-sub {
    color: rgba(255,255,255,0.72);
    font-size: 12px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .status-dot {
    width: 6px; height: 6px;
    background: #7ee8a2;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.85); }
  }

  #back-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    color: white;
    padding: 7px 14px;
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
    z-index: 1;
    transition: background 0.2s;
  }

  #back-btn:hover { background: rgba(255,255,255,0.25); }
  #back-btn svg { width: 14px; height: 14px; fill: white; }

  /* Quick replies */
  #quick-replies {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    overflow-x: auto;
    flex-shrink: 0;
    background: var(--white);
    border-bottom: 1px solid var(--gray-100);
    scrollbar-width: none;
  }
  #quick-replies::-webkit-scrollbar { display: none; }

  .quick-btn {
    flex-shrink: 0;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid var(--teal);
    color: var(--teal);
    background: var(--white);
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .quick-btn:hover, .quick-btn:active {
    background: var(--teal);
    color: white;
  }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--gray-50);
    -webkit-overflow-scrolling: touch;
  }

  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 3px; }

  /* Date divider */
  .date-divider {
    text-align: center;
    font-size: 11px;
    color: var(--gray-500);
    margin: 4px 0;
    letter-spacing: 0.5px;
  }

  /* Message rows */
  .msg-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    max-width: 82%;
    animation: fadeInUp 0.25s ease;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg-row.bot { align-self: flex-start; }

  .msg-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal-dark), var(--teal));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(46,125,140,0.3);
  }

  .msg-avatar svg { width: 17px; height: 17px; fill: white; }

  .bubble {
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg-row.user .bubble {
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    color: white;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 12px rgba(46,125,140,0.25);
  }

  .msg-row.bot .bubble {
    background: var(--white);
    color: var(--gray-900);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
  }

  /* Typing indicator */
  .typing-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
    align-self: flex-start;
    animation: fadeInUp 0.25s ease;
  }

  .typing-bubble {
    background: var(--white);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 13px 18px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .t-dot {
    width: 7px; height: 7px;
    background: var(--teal);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
    opacity: 0.5;
  }
  .t-dot:nth-child(2) { animation-delay: 0.2s; }
  .t-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-7px); opacity: 1; }
  }

  /* Input area */
  #input-area {
    padding: 12px 16px;
    background: var(--white);
    border-top: 1px solid var(--gray-100);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }

  #msg-input {
    flex: 1;
    border: 1.5px solid var(--gray-300);
    border-radius: 24px;
    padding: 10px 18px;
    font-size: 14px;
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--gray-900);
    outline: none;
    background: var(--gray-50);
    transition: border-color 0.2s, background 0.2s;
    -webkit-appearance: none;
  }

  #msg-input:focus {
    border-color: var(--teal);
    background: var(--white);
  }

  #msg-input::placeholder { color: var(--gray-500); }

  #send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal), var(--teal-dark));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 12px rgba(46,125,140,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }

  #send-btn:hover { transform: scale(1.06); box-shadow: 0 4px 16px rgba(46,125,140,0.45); }
  #send-btn:active { transform: scale(0.95); }
  #send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
  #send-btn svg { width: 20px; height: 20px; fill: white; margin-left: 2px; }

  /* Welcome card */
  .welcome-card {
    background: linear-gradient(135deg, var(--teal-pale), #f0f9fb);
    border: 1px solid rgba(46,125,140,0.15);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 4px;
  }

  .welcome-card h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--teal-dark);
    margin-bottom: 6px;
  }

  .welcome-card p {
    font-size: 13px;
    color: var(--gray-700);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="app">
  <div id="chat-header">
    <div id="header-avatar">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
    </div>
    <div id="header-info">
      <div id="header-name">實康復健科診所</div>
      <div id="header-sub">
        <span class="status-dot"></span>
        AI 客服助理
      </div>
    </div>
    <a href="https://www.smartcare.com.tw" id="back-btn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      回官網
    </a>
  </div>

  <div id="quick-replies">
    <button class="quick-btn" onclick="quickSend('門診時間？')">門診時間</button>
    <button class="quick-btn" onclick="quickSend('如何掛號？')">如何掛號</button>
    <button class="quick-btn" onclick="quickSend('診療項目有哪些？')">診療項目</button>
    <button class="quick-btn" onclick="quickSend('兒童早期療育')">早期療育</button>
    <button class="quick-btn" onclick="quickSend('彼拉提斯課程')">彼拉提斯</button>
    <button class="quick-btn" onclick="quickSend('掛號費多少？')">掛號費</button>
  </div>

  <div id="messages">
    <div class="date-divider">今天</div>
    <div class="welcome-card">
      <h3>歡迎使用線上客服</h3>
      <p>您好！我是實康復健科診所的 AI 客服助理，可以回答門診時間、掛號方式、診療項目等問題。如需更多協助，請來電 02-26292000。</p>
    </div>
  </div>

  <div id="input-area">
    <input
      type="text"
      id="msg-input"
      placeholder="請輸入您的問題..."
      onkeydown="handleKey(event)"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
    />
    <button id="send-btn" onclick="sendMsg()" aria-label="送出">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  var API_URL = 'https://smartcare-chatbot.vercel.app/api/chat';
  var isLoading = false;

  function addMessage(type, text) {
    var msgs = document.getElementById('messages');
    var row = document.createElement('div');
    row.className = 'msg-row ' + type;

    if (type === 'bot') {
      var avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
      row.appendChild(avatar);
    }

    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    var msgs = document.getElementById('messages');
    var row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing';
    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>';
    var dots = document.createElement('div');
    dots.className = 'typing-bubble';
    dots.innerHTML = '<div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>';
    row.appendChild(avatar);
    row.appendChild(dots);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function removeTyping() {
    var el = document.getElementById('typing');
    if (el) el.remove();
  }

  function doSend(message) {
    if (!message || isLoading) return;
    var btn = document.getElementById('send-btn');
    isLoading = true;
    btn.disabled = true;
    addMessage('user', message);
    showTyping();

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: message })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      removeTyping();
      addMessage('bot', data.reply || '抱歉，請來電 02-26292000 詢問。');
    })
    .catch(function() {
      removeTyping();
      addMessage('bot', '抱歉，網路連線異常，請來電 02-26292000 或稍後再試。');
    })
    .finally(function() {
      isLoading = false;
      btn.disabled = false;
      document.getElementById('msg-input').focus();
    });
  }

  function sendMsg() {
    var input = document.getElementById('msg-input');
    var message = input.value.trim();
    input.value = '';
    doSend(message);
  }

  function quickSend(text) {
    if (isLoading) return;
    doSend(text);
  }

  function handleKey(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var input = e.target;
      var message = input.value.trim();
      input.value = '';
      doSend(message);
    }
  }

 
  // 修正 iOS 鍵盤彈出時的高度問題
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function() {
      document.getElementById('app').style.height = window.visualViewport.height + 'px';
    });
  }
</script>
</body>
</html>
